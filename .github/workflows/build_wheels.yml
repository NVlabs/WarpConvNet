name: Build and publish wheels

on:
  push:
    tags:
      - v*
  workflow_dispatch:

# Map matrix.cuda short names to Docker image CUDA versions and PyTorch index URLs
#
# Architecture targets are per-matrix-entry (matrix.arch) because Blackwell
# needs CUDA >= 12.8: cu124/cu126 toolchains cannot emit sm_100 or sm_120.
#
# Blackwell targets are deliberately NON-accelerated (10.0, not 10.0a). A plain
# cubin is forward compatible across minor revisions within a major version, so
# sm_100 covers B100/B200/GB200 *and* B300/GB300 (sm_103), and sm_120 covers
# RTX PRO 6000 *and* GB10 (sm_121). An `a`-suffixed cubin is exact-match only
# and would not load on GB300 at all (measured on device).
env:
  TORCH_CUDA_ARCH_LIST_DEFAULT: "8.0;8.6;8.9;9.0a"

jobs:
  build_wheels:
    name: "py${{ matrix.python }} torch${{ matrix.torch }} ${{ matrix.cuda }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: nvidia/cuda:${{ matrix.cuda_docker }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- torch 2.11.0 + cu130 ----
          - { torch: "2.11.0", torch_short: "2.11", cuda: "cu130", cuda_docker: "13.0.1", python: "3.10", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.11.0", torch_short: "2.11", cuda: "cu130", cuda_docker: "13.0.1", python: "3.11", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.11.0", torch_short: "2.11", cuda: "cu130", cuda_docker: "13.0.1", python: "3.12", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.11.0", torch_short: "2.11", cuda: "cu130", cuda_docker: "13.0.1", python: "3.13", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.11.0", torch_short: "2.11", cuda: "cu130", cuda_docker: "13.0.1", python: "3.14", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          # ---- torch 2.10.0 + cu130 ----
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu130", cuda_docker: "13.0.1", python: "3.10", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu130", cuda_docker: "13.0.1", python: "3.11", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu130", cuda_docker: "13.0.1", python: "3.12", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          # ---- torch 2.10.0 + cu128 ----
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu128", cuda_docker: "12.8.0", python: "3.10", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu128", cuda_docker: "12.8.0", python: "3.11", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu128", cuda_docker: "12.8.0", python: "3.12", arch: "8.0;8.6;8.9;9.0a;12.0;10.0" }
          # ---- torch 2.10.0 + cu126 ----
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu126", cuda_docker: "12.6.3", python: "3.10", arch: "8.0;8.6;8.9;9.0a" }
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu126", cuda_docker: "12.6.3", python: "3.11", arch: "8.0;8.6;8.9;9.0a" }
          - { torch: "2.10.0", torch_short: "2.10", cuda: "cu126", cuda_docker: "12.6.3", python: "3.12", arch: "8.0;8.6;8.9;9.0a" }
          # ---- torch 2.5.1 + cu124 ----
          - { torch: "2.5.1", torch_short: "2.5", cuda: "cu124", cuda_docker: "12.4.1", python: "3.10", arch: "8.0;8.6;8.9;9.0a" }
          - { torch: "2.5.1", torch_short: "2.5", cuda: "cu124", cuda_docker: "12.4.1", python: "3.11", arch: "8.0;8.6;8.9;9.0a" }
          - { torch: "2.5.1", torch_short: "2.5", cuda: "cu124", cuda_docker: "12.4.1", python: "3.12", arch: "8.0;8.6;8.9;9.0a" }

    steps:
      - name: Free disk space on runner
        run: |
          df -h || true
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h || true

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create venv and install dependencies
        run: |
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} /tmp/buildenv
          . /tmp/buildenv/bin/activate
          uv pip install uv uv-pip
          pip install --upgrade setuptools 'setuptools-scm<10' wheel pybind11 ninja
          pip install torch==${{ matrix.torch }}+${{ matrix.cuda }} \
            --index-url https://download.pytorch.org/whl/${{ matrix.cuda }}

      - name: Build wheel
        env:
          MAX_JOBS: "2"
          NVCC_THREADS: "1"
          TORCH_CUDA_ARCH_LIST: ${{ matrix.arch || env.TORCH_CUDA_ARCH_LIST_DEFAULT }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /tmp/buildenv/bin/activate
          echo "TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST}"
          # Get base version without local segment, then append torch tag.
          # local_scheme must be passed as a keyword: setuptools-scm ignores the
          # SETUPTOOLS_SCM_LOCAL_SCHEME env var, so off-tag builds would keep
          # their "+gHASH" segment and produce a PEP 440-invalid double-local
          # version like "1.8.1.dev1+gHASH+torch2.11cu130".
          BASE_VERSION=$(python -c "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))")
          export SETUPTOOLS_SCM_PRETEND_VERSION="${BASE_VERSION}+torch${{ matrix.torch_short }}${{ matrix.cuda }}"
          echo "Building version: ${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python setup.py bdist_wheel

      - name: Repair wheel (manylinux tag)
        run: |
          . /tmp/buildenv/bin/activate
          pip install auditwheel patchelf
          auditwheel repair dist/*.whl \
            --plat manylinux_2_28_x86_64 \
            -w dist/repaired/ \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_python.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so \
            --exclude libcudart.so \
            --exclude libcublas.so \
            --exclude libcublasLt.so \
            --exclude libcuda.so || cp dist/*.whl dist/repaired/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-torch${{ matrix.torch_short }}-${{ matrix.cuda }}-py${{ matrix.python }}
          path: dist/repaired/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build sdist
        run: |
          pip install build 'setuptools-scm<10'
          # Suppress local version segment (+g1234567) — PyPI rejects local
          # identifiers. Must go through PRETEND_VERSION: setuptools-scm ignores
          # the SETUPTOOLS_SCM_LOCAL_SCHEME env var.
          SETUPTOOLS_SCM_PRETEND_VERSION=$(python -c "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))")
          export SETUPTOOLS_SCM_PRETEND_VERSION
          echo "Building sdist version: ${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_release:
    name: Upload wheels to GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    # Tag pushes only. A workflow_dispatch run is a build test; without this
    # guard it would cut a public release named after the off-tag dev version
    # (e.g. v1.8.1.dev1). Dispatch runs still expose every wheel as a run
    # artifact. Matches the guard on publish_pypi below.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-wheels/
          pattern: wheel-*
          merge-multiple: true

      - name: Determine version tag
        id: version
        run: |
          pip install 'setuptools-scm<10'
          VERSION=$(python -c "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Tag: ${TAG}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Create release if it doesn't exist
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          # Upload wheels (overwrite if re-running)
          gh release upload "$TAG" all-wheels/*.whl --clobber

  publish_pypi:
    name: Publish sdist to PyPI
    needs: build_sdist
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
